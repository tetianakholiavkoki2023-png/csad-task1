name: CI

on:
  push:
    branches: 
      - '**develop**'
      - '**master**'
  pull_request:
    branches: 
      - '**develop**'
      - '**master**'

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build
        run: bash ./ci.sh
        shell: bash
        
      - name: Deploy (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: |
            build/hello
            build/hello.exe
            build/Debug/hello.exe
          if-no-files-found: error